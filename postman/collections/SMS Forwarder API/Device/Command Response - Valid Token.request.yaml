$kind: http-request
name: 'Command Response - Valid Token'
method: POST
url: '{{base_url}}/api/device/command-response'
order: 3000
headers:
  - key: X-Device-Token
    value: '{{device_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "command": "AT+CSQ",
      "response": "+CSQ: 28,0\n\nOK"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("success is true", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.be.true;
      });

      pm.test("message equals 'Command response updated successfully.'", function () {
        const json = pm.response.json();
        pm.expect(json.message).to.equal("Command response updated successfully.");
      });
