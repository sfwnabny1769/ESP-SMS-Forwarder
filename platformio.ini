[platformio]
default_envs = esp32-s3-devkitc-1

; =============================================================================
; Environment Utama: ESP32-S3 SMS Gateway Firmware
; =============================================================================
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -Iinclude
build_src_filter = 
    +<main.cpp>
lib_deps = 
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    Wire

; =============================================================================
; Environment Khusus: Uji Coba Diagnostik OLED (I2C Scanner & Visual Test)
; =============================================================================
[env:test-oled]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = 
    +<../test/test_oled_diagnostic.cpp>
    -<main.cpp>
lib_deps = 
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    Wire